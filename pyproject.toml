[project]
name = "webhunter"
version = "1.0.0"
description = "WebHunter — standalone web search + crawling microservice (ddgs + Playwright)"
readme = "README.md"
requires-python = ">=3.11.9"
license = { text = "MIT" }
keywords = ["web-search", "web-scraping", "playwright", "duckduckgo", "microservice", "fastapi"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "ddgs>=9.5.4",
    "playwright>=1.50.0",
]

[project.urls]
Homepage = "https://github.com/nayaksomkar/WebHunter"
Repository = "https://github.com/nayaksomkar/WebHunter"
Documentation = "https://github.com/nayaksomkar/WebHunter#readme"

[project.scripts]
webhunter = "totem.cli:main"
