services:
  server:
    build: .
    image: webhunter
    ports:
      - "8765:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - HOST=${HOST:-0.0.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_RESULTS=${MAX_RESULTS:-6}
      - MAX_PAGES=${MAX_PAGES:-3}
      - PAGE_TIMEOUT_MS=${PAGE_TIMEOUT_MS:-30000}
      - CONTENT_MAX_CHARS=${CONTENT_MAX_CHARS:-8000}
      - SEARCH_VARIANTS=${SEARCH_VARIANTS:-}
      - LLMPING_URL=${LLMPING_URL:-https://llmping.onrender.com}
      - COMPETITOR_ENGINE_URL=${COMPETITOR_ENGINE_URL:-https://competitorengine.onrender.com}
      - RENDER_EXTERNAL_URL=${RENDER_EXTERNAL_URL:-}
    command: ["python", "main.py", "server"]
