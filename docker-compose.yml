# Docker Compose config for crawl4ai
# Starts the crawl4ai API server with a mounted scripts directory.
services:
  crawl4ai:
    # Official crawl4ai Docker image (includes FastAPI server + Playwright browser)
    image: unclecode/crawl4ai:latest
    ports:
      # Host:Container  — send requests to http://localhost:11235
      - "11235:11235"
    volumes:
      # Shared memory for Chromium browser performance
      - /dev/shm:/dev/shm
      # Mount your local scripts/ directory into the container at /scripts
      - ./scripts:/scripts
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
